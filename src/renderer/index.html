<!doctype html>
<html data-theme="win-light">
  <head>
    <meta charset="UTF-8" />
    <title>Coterea</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/icon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
      html {
        color-scheme: light;
        background: #ffffff;
      }
      html[data-theme='win-dark'] {
        color-scheme: dark;
        background: #1e1e1e;
      }
      html[data-theme='hc-light'] {
        color-scheme: light;
        background: #ffffff;
      }
      html[data-theme='hc-dark'] {
        color-scheme: dark;
        background: #000000;
      }
      html[data-theme='warm-light'] {
        color-scheme: light;
        background: #f5f0e6;
      }
      html[data-theme='warm-dark'] {
        color-scheme: dark;
        background: #1a1f1a;
      }
      html,
      body,

        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: inherit;
      }

    <meta
      http-equiv="Content-Security-Policy"

    />
  </head>

    <script type="module" src="/src/main.tsx"></script>
